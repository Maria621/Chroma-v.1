name: QA — Instituto Chroma

on:
  push:
    branches:
      - revisao-institucional-v4
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: npm run check:js
      - name: Validate institutional pages and shared components
        run: npm test
